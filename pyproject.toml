[project]
name = "transcriptor-audio"
version = "0.1.0"
description = "Transcripción de audio 100% local con faster-whisper (GPU CUDA con fallback a CPU)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1",
    "gradio>=5",
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
transcriptor = "transcriptor.cli:main"
transcriptor-app = "transcriptor.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
